[package]
name = "bimcraft-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BimCraft browser edition (eframe web on wasm32)"

[[bin]]
name = "bimcraft-web"
path = "src/main.rs"

[dependencies]
bimcraft-bim = { workspace = true }
bimcraft-io = { workspace = true }
bimcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlCanvasElement"] }

[lints]
workspace = true
