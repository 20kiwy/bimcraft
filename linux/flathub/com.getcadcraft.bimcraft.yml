id: com.getcadcraft.bimcraft
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: bimcraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: shell
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/shell/cargo
        CARGO_NET_OFFLINE: "true"
        TAURI_CONFIG: "{\"productName\":\"BimCraft\",\"mainBinaryName\":\"bimcraft\",\"identifier\":\"com.getcadcraft.bimcraft\",\"version\":\"0.4.0\",\"bundle\":{\"icon\":[\"../com.getcadcraft.bimcraft-128.png\",\"../com.getcadcraft.bimcraft-512.png\"]}}"
    build-commands:
      - cd src-tauri && cargo --offline build --release --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/cadcraft-desktop /app/bin/bimcraft
      - mkdir -p /app/lib/BimCraft && cp -r edition /app/lib/BimCraft/app
      - rm -f /app/lib/BimCraft/app/.htaccess /app/lib/BimCraft/app/web.config /app/lib/BimCraft/app/INSTALL.md /app/lib/BimCraft/app/sw.js
      - install -Dm644 shell.json /app/lib/BimCraft/shell.json
      - install -Dm644 LICENSE /app/lib/BimCraft/LICENSE
      - install -Dm644 THIRD_PARTY.md /app/lib/BimCraft/THIRD_PARTY.md
      - install -Dm644 com.getcadcraft.bimcraft.desktop /app/share/applications/com.getcadcraft.bimcraft.desktop
      - install -Dm644 com.getcadcraft.bimcraft.metainfo.xml /app/share/metainfo/com.getcadcraft.bimcraft.metainfo.xml
      - install -Dm644 com.getcadcraft.bimcraft.svg /app/share/icons/hicolor/scalable/apps/com.getcadcraft.bimcraft.svg
      - install -Dm644 com.getcadcraft.bimcraft-64.png /app/share/icons/hicolor/64x64/apps/com.getcadcraft.bimcraft.png
      - install -Dm644 com.getcadcraft.bimcraft-128.png /app/share/icons/hicolor/128x128/apps/com.getcadcraft.bimcraft.png
      - install -Dm644 com.getcadcraft.bimcraft-256.png /app/share/icons/hicolor/256x256/apps/com.getcadcraft.bimcraft.png
      - install -Dm644 com.getcadcraft.bimcraft-512.png /app/share/icons/hicolor/512x512/apps/com.getcadcraft.bimcraft.png
      - install -Dm644 com.getcadcraft.bimcraft.mime.xml /app/share/mime/packages/com.getcadcraft.bimcraft.xml
    sources:
